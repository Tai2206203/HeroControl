name: Build HeroControl TIPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate source contract
        run: |
          python3 scripts/validate-project.py
          python3 scripts/verify-runtime-payload.py
          python3 scripts/source-manifest.py
      - name: Test game adapter Lua with controlled interfaces
        run: |
          if ! command -v lua >/dev/null; then brew install lua; fi
          lua scripts/runtime-smoke.lua
          lua scripts/report-monitor-smoke.lua
          lua scripts/report-reasons-smoke.lua
      - name: Test Telegram delivery without network
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and package iPhone app
        run: bash scripts/build-tipa.sh
      - name: Build ABI example
        run: bash scripts/build-example-backend.sh
      - name: Test iPhone Simulator
        run: bash scripts/test-simulator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DORO-CHEAT-TIPA
          path: |
            dist/DORO-CHEAT.tipa
            dist/DORO-CHEAT.tipa.sha256
            dist/signing-report.json
          if-no-files-found: error
      - name: Send successful build to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/send-telegram.py dist/DORO-CHEAT.tipa
