name: Build HeroControl TIPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate source contract
        run: python3 scripts/validate-project.py
      - name: Test Telegram delivery without network
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and package iPhone app
        run: bash scripts/build-tipa.sh
      - name: Build ABI example
        run: bash scripts/build-example-backend.sh
      - name: Test iPhone Simulator
        run: bash scripts/test-simulator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HeroControl-TIPA-diagnostics
          path: |
            dist/HeroControl.tipa
            dist/HeroControl.tipa.sha256
            dist/signing-report.json
          if-no-files-found: error
      - name: Send successful build to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/send-telegram.py dist/HeroControl.tipa
